name: Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  types:
    name: Types
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check

  architecture:
    name: Architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint:architecture
      - run: pnpm lint:unused

  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: >-
          pnpm exec prek run --all-files --show-diff-on-failure
          --skip biome --skip svelte-check --skip architecture --skip knip --skip no-generated-code-in-src --skip gitleaks

  commits:
    name: Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  abilities:
    name: Abilities
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Warn when a change touches several abilities
        run: |
          abilities=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -oE '^src/features/[^/]+/abilities/[^/]+' | sort -u | paste -sd ' ' -)
          count=$(printf '%s' "$abilities" | wc -w)
          if [ "$count" -gt 1 ]; then
            echo "::warning title=Several abilities::One pull request per ability is the rule (ADR-043); this one touches $count: $abilities"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces
          path: .vitest/traces/*.trace.zip
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore

  scenarios:
    name: Scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:cucumber

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: sudo apt-get install --yes --no-install-recommends graphviz
      - run: pnpm build
      - run: pnpm test:size
      - run: pnpm docs:build
      - run: pnpm lint:html
      - run: pnpm lint:generated

  end-to-end:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:e2e

  end-to-end-base-path:
    name: End-to-end (base path)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:e2e
        env:
          BASE_PATH: /untracked

  lighthouse-page:
    name: Lighthouse (${{ matrix.page }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - page: /
            accept-lang: en
          - page: /privacy
            accept-lang: en
          - page: /fr
            accept-lang: fr-FR,fr
          - page: /fr/privacy
            accept-lang: fr-FR,fr
    steps:
      - name: Measure each commit once, never on a rerun
        run: test "$ATTEMPT" = 1
        env:
          ATTEMPT: ${{ github.run_attempt }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: >-
          pnpm exec lhci autorun --collect.url="http://localhost:4174$PAGE"
          --collect.settings.chromeFlags="--headless=new --accept-lang=$ACCEPT_LANG"
        env:
          PAGE: ${{ matrix.page }}
          ACCEPT_LANG: ${{ matrix.accept-lang }}
      - name: Report the measures of each run
        if: always()
        run: |
          {
            echo '| Page | Total Blocking Time (ms) | Longest task (ms) | LCP (ms) | Performance | Benchmark index |'
            echo '| --- | ---: | ---: | ---: | ---: | ---: |'
            jq -r '[.requestedUrl,
            (.audits["total-blocking-time"].numericValue | round),
            ([.audits["long-tasks"].details.items[]?.duration] | max // 0 | round),
            (.audits["largest-contentful-paint"].numericValue | round),
            .categories.performance.score,
            (.environment.benchmarkIndex | round)] | map(tostring) | "| " + join(" | ") + " |"' .lighthouseci/lhr-*.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ strategy.job-index }}
          path: .lighthouseci
          retention-days: 7
          include-hidden-files: true

  lighthouse:
    name: Lighthouse
    if: always()
    needs: lighthouse-page
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.lighthouse-page.result }}

  dev-container:
    name: Dev Container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: pnpm exec prek run --all-files
          env: GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ github.token }}

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo" -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
